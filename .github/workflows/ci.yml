# CI — the same three gates the codebase was built against:
# typecheck (strict) + eslint + node jest suites. The typed API client is
# regenerated from the committed openapi.yaml snapshot before typechecking.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
