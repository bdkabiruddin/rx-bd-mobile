# Offline → queue a booking → reconnect → exactly-once sync.
# Proves the read-cache + queued-write outbox + idempotent replay path.
appId: bd.rx.patient
env:
  RXBD_TEST_EMAIL: ${RXBD_TEST_EMAIL}
  RXBD_TEST_PASSWORD: ${RXBD_TEST_PASSWORD}
---
- launchApp:
    clearState: false
- assertVisible: 'Upcoming appointments'

# Go offline (airplane mode via the test harness / adb).
- setAirplaneMode: enabled

# The offline banner appears; cached data still renders.
- assertVisible: 'Offline'

# Queue a booking while offline (navigates into the booking flow — IDs are
# placeholders matched to the Phase-2 patient booking screen).
- tapOn:
    id: 'book-appointment'
- tapOn:
    id: 'confirm-booking'
# Optimistic state shows a pending-sync marker.
- assertVisible: 'Pending sync'

# Reconnect — the outbox drains with the stable Idempotency-Key.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: 'Live'
    timeout: 20000

# The pending marker clears; exactly one booking exists (asserted server-side
# in CI by the harness querying the API with the idempotency key).
- assertNotVisible: 'Pending sync'
